<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel da loja | Projeto JP</title>
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel da loja">
<link rel="manifest" href="site/painel.webmanifest">
<link rel="icon" href="site/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="site/icone-apple.png">
<link rel="stylesheet" href="site/painel.css">
<script src="site/comum.js" defer></script>
<script src="site/painel.js" defer></script>
</head>
<body>
<div class="app">

  <!-- Entrar -->
  <section class="login" id="tela-login" hidden>
    <div class="logo">E</div>
    <h1>Painel da loja</h1>
    <p>Consulta de vendas e estoque da empresa.</p>
    <form id="form-login" novalidate>
      <div class="erro" id="erro-login" role="alert" hidden></div>
      <div><label for="l-servidor">Servidor</label><input type="text" class="srv" id="l-servidor" autocomplete="organization" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="Ex.: MERCADO BOM PRECO"></div>
      <div><label for="l-usuario">Usuário</label><input type="text" id="l-usuario" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="60"></div>
      <div><label for="l-senha">Senha</label><input type="password" id="l-senha" autocomplete="current-password" maxlength="64"></div>
      <label class="lembrar"><input type="checkbox" id="l-lembrar" checked> Lembrar servidor e usuário</label>
      <button class="entrar" id="l-entrar" type="submit">Entrar</button>
    </form>
    <div class="rod">Acesso somente para consulta; nenhuma informação é alterada.<br>Disponível para usuários com a permissão “Ver vendas” na Gestão.<br><a href="./">Saiba mais sobre o sistema</a></div>
  </section>

  <!-- Painel: no celular, abas embaixo; no computador, menu lateral -->
  <div class="painel" id="tela-painel" hidden>
    <aside class="lateral">
      <div class="marca"><div class="logo" id="logo-loja" aria-hidden="true"></div><div class="nomes"><b id="nome-loja"></b><small>Painel da loja</small></div></div>
      <nav class="nav" aria-label="Telas do painel">
        <a href="#inicio" data-aba="inicio"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></a>
        <a href="#vendas" data-aba="vendas"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Vendas</span></a>
        <a href="#produtos" data-aba="produtos"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Produtos</span></a>
        <a href="#estoque" data-aba="estoque"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg><span>Estoque</span></a>
        <a href="#instalador" data-aba="instalador"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5"/><path d="M4 17v3h16v-3"/></svg><span>Instalador</span></a>
      </nav>
      <div class="usuario"><b id="nome-usuario"></b><button type="button" id="bt-sair">Sair</button></div>
    </aside>
    <div class="principal">
      <div class="topo" id="topo"></div>
      <main class="corpo" id="corpo" aria-live="polite"></main>
    </div>
  </div>
</div>
</body>
</html>
