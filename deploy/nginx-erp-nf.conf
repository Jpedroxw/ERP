# Site do ERP não fiscal no Nginx da VPS (Passo 4 do guia).
#
# Instalar:
#   cp nginx-erp-nf.conf /etc/nginx/sites-available/erp-nf
#   ln -sf /etc/nginx/sites-available/erp-nf /etc/nginx/sites-enabled/erp-nf
#   nginx -t && systemctl reload nginx
#   apt install -y certbot python3-certbot-nginx
#   certbot --nginx -d erp.f84568e4.vps.hospedeaqui.cloud
#
# O certbot acrescenta sozinho a parte do HTTPS (porta 443) neste arquivo.
# No caixa e na Retaguarda digita-se só o nome do servidor (nuvem); o site fica na Configuração técnica.
# Domínio próprio: acrescente o nome no server_name (separado por espaço) e rode o certbot com os dois -d.

server {
    listen 80;
    server_name erp.f84568e4.vps.hospedeaqui.cloud;

    location /nf/ {
        proxy_pass         http://127.0.0.1:5080/;   # a barra final tira o /nf antes de repassar
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 20m;                    # lotes grandes de vendas offline
        proxy_read_timeout 60s;
    }
}
